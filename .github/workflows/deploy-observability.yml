name: Deploy observability

# Keep the observability VM (/opt/petabyte-observability) in sync with this repo's
# observability/ tree — Grafana dashboards, provisioning, docker-compose and the backend
# configs — and reload the stack. Fires automatically whenever anything under observability/
# changes, plus manual dispatch.
#
# The REPO is the source of truth. The deploy is non-destructive to data: it backs up the
# current config on the VM first, rsyncs WITHOUT --delete for the whole tree (so named-volume
# data and VM-only files survive), and only prunes the grafana/dashboards folder (JSON only, no
# data) so a dashboard deleted in git is also removed on the VM.
#
# Secrets used (never printed):
#   DROPLET_HOST_OBSERV            host of the observability VM
#   DROPLET_USER                   ssh user with write access to /opt/petabyte-observability + docker
#   DEPLOY_SSH_KEY                 private key for that user
#   DROPLET_SSH_KNOWN_HOSTS_OBSERV (optional) pinned host key; if unset we ssh-keyscan (TOFU) — only
#                                  non-secret config is shipped (never .env), so the blast radius is low.

on:
  push:
    branches: [main]
    paths:
      - "observability/**"
      - ".github/workflows/deploy-observability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-observability
  cancel-in-progress: false

jobs:
  validate:
    # Fail BEFORE touching the VM if a dashboard references a non-existent metric, the generated
    # JSON drifted from the generator, or any YAML is invalid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml          # setup-python ships CPython only; the YAML step needs PyYAML
      - name: dashboards — metric existence + generator determinism
        run: |
          set -euo pipefail
          python observability/grafana/validate_dashboards.py
          python observability/grafana/build_dashboards.py
          git diff --exit-code observability/grafana/dashboards
      - name: provisioning config — provider path == compose mount, folder, uids
        # Fail BEFORE deploying if the provider path drifts from the compose bind mount,
        # the dashboards path gets nested under the named volume (masking risk), the folder
        # isn't Petabyte, or the committed JSON set is malformed / missing a canonical uid.
        run: python observability/grafana/verify_provisioning.py
      - name: compose + configs — YAML validity
        run: |
          python - <<'PY'
          import glob, yaml
          bad = 0
          for f in glob.glob("observability/**/*.yml", recursive=True) + \
                   glob.glob("observability/**/*.yaml", recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  bad += 1; print(f"FAIL {f}: {e}")
          print("yaml ok" if not bad else "yaml errors")
          raise SystemExit(1 if bad else 0)
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # ENV_VARS and the deploy Secrets live in the TEST GitHub Environment. Bind to it so the job
    # can read environment-scoped config (repo-level vars/secrets stay visible too — binding is
    # purely additive). Without this, `vars.ENV_VARS` resolves empty and the resolve step below
    # fails with "DROPLET_HOST_OBSERV and DROPLET_USER must be in ENV_VARS".
    environment: TEST
    env:
      # DROPLET_HOST_OBSERV + DROPLET_USER are NON-secret config in the ENV_VARS bundle, resolved
      # below. Only DEPLOY_SSH_KEY (and the host pin) stay Secrets.
      REMOTE_DIR: /opt/petabyte-observability
      SSH: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve host + user from ENV_VARS
        env:
          # Works whether the bundle is stored under the TEST environment's Variables or Secrets.
          ENV_VARS: ${{ vars.ENV_VARS || secrets.ENV_VARS }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os, sys
          sys.path.insert(0, "scripts")
          import env_vars as ev
          vals, _ = ev.parse_bundle(os.environ.get("ENV_VARS", "") or "")
          host, user = vals.get("DROPLET_HOST_OBSERV", ""), vals.get("DROPLET_USER", "")
          if not host or not user:
              sys.stderr.write("::error::DROPLET_HOST_OBSERV and DROPLET_USER must be in ENV_VARS\n")
              sys.exit(1)
          print(f"OBS_HOST={host}")
          print(f"OBS_USER={user}")
          PY

      - name: Set up SSH key + host pin
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS_OBSERV: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS_OBSERV }}
        run: |
          set -euo pipefail
          if [ -z "${OBS_HOST:-}" ] || [ -z "${OBS_USER:-}" ]; then
            echo "::error::DROPLET_HOST_OBSERV and DROPLET_USER must be set in the ENV_VARS bundle." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail CLOSED on a missing pin — never trust-on-first-use. An unauthenticated
          # ssh-keyscan lets an active network attacker impersonate the VM and receive the
          # deploy. Pin the host key (verify the fingerprint out-of-band via the provider
          # console first), same posture as the platform deploy.
          if [ -z "${KNOWN_HOSTS_OBSERV//[[:space:]]/}" ]; then
            echo "::error::DROPLET_SSH_KNOWN_HOSTS_OBSERV secret is empty — refusing to deploy" \
                 "without a pinned host key. Generate it with: ssh-keyscan -t ed25519,rsa <observ-host>," \
                 "verify the fingerprint via the provider console, then store it as the" \
                 "DROPLET_SSH_KNOWN_HOSTS_OBSERV Secret." >&2
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS_OBSERV" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Preflight — remote dir + .env present
        run: |
          set -euo pipefail
          $SSH "$OBS_USER@$OBS_HOST" '
            set -e
            cd '"$REMOTE_DIR"' || { echo "::error::'"$REMOTE_DIR"' does not exist on the VM"; exit 1; }
            if [ ! -f .env ]; then
              echo "::error::'"$REMOTE_DIR"'/.env is missing — it must define GF_SECURITY_ADMIN_PASSWORD (see observability/.env.example). Not shipped by CI on purpose."
              exit 1
            fi
            command -v docker >/dev/null || { echo "::error::docker not found for '"$OBS_USER"'"; exit 1; }
            command -v rsync >/dev/null || { echo "::error::rsync not installed on the VM (apt-get install -y rsync)"; exit 1; }
            echo "preflight ok"'

      - name: Backup current config on the VM (keep last 10)
        run: |
          set -euo pipefail
          $SSH "$OBS_USER@$OBS_HOST" '
            set -e
            cd '"$REMOTE_DIR"'
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            mkdir -p backups/"$ts"
            for p in docker-compose.yml grafana prometheus loki tempo otel-collector compose; do
              [ -e "$p" ] && cp -a "$p" backups/"$ts"/ || true
            done
            ls -1dt backups/*/ 2>/dev/null | tail -n +11 | xargs -r rm -rf
            echo "backed up config to backups/$ts"'

      # Whole-tree sync WITH --delete so a file removed from the repo is pruned on the VM too
      # (stale Prometheus rules, provisioning, dashboards, service configs). Excludes only
      # VM-owned paths: .env (secret — never shipped) and backups/. All stack DATA lives in
      # docker NAMED VOLUMES outside REMOTE_DIR, so --delete never touches metric/log/trace
      # history; the pre-deploy backup above snapshots the config for rollback.
      - name: Rsync observability/ -> VM (repo is source of truth; prune stale files)
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude ".env" --exclude "backups/" --exclude "__pycache__/" \
            --exclude ".ruff_cache/" --exclude "*.pyc" \
            -e "$SSH" \
            observability/ "$OBS_USER@$OBS_HOST:$REMOTE_DIR/"

      - name: docker compose up + apply config changes
        run: |
          set -euo pipefail
          $SSH "$OBS_USER@$OBS_HOST" '
            set -e
            cd '"$REMOTE_DIR"'
            docker compose config >/dev/null
            docker compose up -d --remove-orphans
            # Bind-mounted config changes need a nudge to take effect:
            #  - Prometheus reloads rules/config on SIGHUP (no downtime).
            #  - Loki/Tempo/OTel pick up their mounted configs on restart.
            docker compose kill -s HUP prometheus 2>/dev/null || true
            docker compose restart loki tempo otel-collector
            # Grafana: FORCE-RECREATE (not restart). A plain `docker compose restart` reuses
            # the existing container and does NOT apply mount/volume changes — so a change to
            # the dashboards bind mount would never take effect. Recreating guarantees the
            # container comes up with the current mounts and re-runs file provisioning.
            docker compose up -d --force-recreate grafana
            echo "compose applied"'

      - name: Verify dashboards provisioned (health + datasources + UIDs) or rollback
        # SUCCESS requires ALL of: Grafana HTTP healthy AND datasources provisioned AND every
        # expected dashboard UID present in the Petabyte folder. A healthy /api/health alone is
        # NOT sufficient — that is exactly how the folder was silently empty before. On failure,
        # dump NON-SECRET diagnostics, roll back to the last good config, RE-VERIFY the rollback,
        # and fail the job.
        run: |
          set -euo pipefail
          $SSH "$OBS_USER@$OBS_HOST" '
            set -uo pipefail
            cd '"$REMOTE_DIR"'
            # creds for the local API come from the VM .env; never printed. Default user=admin.
            set -a; . ./.env 2>/dev/null || true; set +a
            export GF_SECURITY_ADMIN_USER="${GF_SECURITY_ADMIN_USER:-admin}"

            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
              sleep 5
            done

            verify() { GRAFANA_URL=http://127.0.0.1:3000 python3 grafana/verify_provisioning.py \
                         --grafana-url http://127.0.0.1:3000 --skip-static-config; }

            if verify; then
              echo "VERIFIED: all expected dashboards present in the Petabyte folder"
              exit 0
            fi

            echo "::group::provisioning diagnostics (non-secret)"
            echo "--- docker compose ps ---";           docker compose ps || true
            echo "--- dashboard files on host ---";      ls -la grafana/dashboards | tail -n +1 || true
            echo "--- dashboard files inside container ---"
            docker compose exec -T grafana sh -c "ls -la /etc/grafana/dashboards 2>&1; echo; ls -la /etc/grafana/provisioning/dashboards 2>&1" || true
            echo "--- grafana mounts (prove the bind mount is present, not masked) ---"
            docker inspect -f "{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}} ro={{if .RW}}false{{else}}true{{end}}{{println}}{{end}}" "$(docker compose ps -q grafana)" || true
            echo "--- grafana provisioning log lines ---"
            docker compose logs --tail=400 grafana 2>&1 | grep -iE "provision|dashboard|folder|datasource|duplicate|uid|permission|invalid|error" | tail -n 60 || true
            echo "::endgroup::"

            echo "::error::Dashboard provisioning verification FAILED — restoring the last good config"
            last=$(ls -1dt backups/*/ 2>/dev/null | head -1)
            if [ -n "$last" ]; then
              for p in docker-compose.yml grafana prometheus loki tempo otel-collector compose; do
                if [ -e "$last/$p" ]; then rm -rf "./$p"; cp -a "$last/$p" "./$p"; fi
              done
              docker compose up -d --remove-orphans
              docker compose kill -s HUP prometheus 2>/dev/null || true
              docker compose restart loki tempo otel-collector 2>/dev/null || true
              docker compose up -d --force-recreate grafana 2>/dev/null || true
              for i in $(seq 1 24); do
                curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break; sleep 5
              done
              if verify; then
                echo "::warning::Rolled back to the previous config and it verifies clean."
              else
                echo "::error::ROLLBACK ALSO FAILS verification — the previous config is not known-good either. Manual intervention needed."
              fi
            else
              echo "::error::No backup found to roll back to."
            fi
            exit 1'

      - name: Deploy summary (no secrets, evidence-based)
        if: always()
        run: |
          {
            echo "## Observability deploy"
            echo ""
            echo "Synced \`observability/\` -> \`$REMOTE_DIR\` and reloaded the stack."
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Grafana dashboards VERIFIED present** in the \`Petabyte\` folder via the "
              echo "Grafana API (every expected UID from committed JSON). · https://data.petabyte.market"
            else
              echo "**Deploy FAILED provisioning verification** — Grafana may be alive but the "
              echo "\`Petabyte\` dashboards are not confirmed present. See the verify step's "
              echo "diagnostics group above (host/container files, mounts, provisioning logs, "
              echo "expected vs observed UIDs). A config rollback was attempted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
