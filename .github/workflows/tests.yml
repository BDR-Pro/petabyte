name: tests

# Runs the full suite against BOTH engines.
#
# The Postgres job is the one that counts. SQLite has no decimal type and serialises
# writers, so it structurally cannot see the two bug classes that matter most here:
# money precision and concurrent races. A green SQLite run is a smoke signal, not
# confidence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # manual trigger — required for the opt-in real Mailgun send job

# Least privilege: the whole suite only needs to read the repo. No job pushes, comments,
# or mutates GitHub state — checkouts below also drop the persisted token.
permissions:
  contents: read

jobs:
  sqlite:
    name: sqlite (fast signal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: money-safety guard (no live Stripe key / live-money switch in CI)
        run: python scripts/ci_guard_no_live.py
      - run: pip install -r lumaris_api/requirements.txt
      - name: smoke
        working-directory: lumaris_api
        run: python smoke_test.py
      - name: adversarial (money + races)
        working-directory: lumaris_api
        run: python adversarial_test.py
      - name: stripe connect (offline, fake gateway)
        working-directory: lumaris_api
        run: python stripe_test.py
      - name: pricing (config validation + absolute charge ceiling)
        working-directory: lumaris_api
        run: python pricing_test.py
      - name: payout routing (provider-neutral, offline)
        working-directory: lumaris_api
        run: python payout_test.py
      - name: email (mailgun, offline unit)
        working-directory: lumaris_api
        run: python email_test.py
      - name: matmul result validation (offline)
        working-directory: lumaris_api
        run: python matmul_validation_test.py
      - name: account (reset + cal webhook + demo notify)
        working-directory: lumaris_api
        run: python account_test.py
      - name: wallet (add funds via stripe checkout)
        working-directory: lumaris_api
        run: python wallet_test.py
      - name: seller integrity audits (anti-fraud)
        working-directory: lumaris_api
        run: python seller_audit_test.py
      - name: quorum verification (redundant re-execution)
        working-directory: lumaris_api
        run: python quorum_test.py
      - name: marketplace intelligence (health/routing/trust/timeline)
        working-directory: lumaris_api
        run: python marketplace_test.py
      - name: newsletter signup (Mailgun mailing list; Mailgun mocked)
        working-directory: lumaris_api
        run: python newsletter_test.py
      - name: tunnel (NAT traversal + failover)
        working-directory: lumaris_gateway
        run: python tunnel_test.py

  postgres:
    name: postgres (the one that counts)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petabyte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/petabyte_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r lumaris_api/requirements.txt

      - name: smoke (postgres)
        working-directory: lumaris_api
        run: python smoke_test.py

      - name: adversarial — money conservation under real parallel writers
        working-directory: lumaris_api
        run: python adversarial_test.py

      - name: stripe connect — full flow on Postgres (fake gateway)
        working-directory: lumaris_api
        run: python stripe_test.py

      - name: payout routing — provider-neutral obligations + aggregation on Postgres
        working-directory: lumaris_api
        run: python payout_test.py

      - name: e2e safety — no silent fake gateway / connect-mode / payout-hold clock
        working-directory: lumaris_api
        run: python e2e_safety_test.py

      - name: e2e flow — dispatch ONCE -> auto meter+capture -> held payout (idempotent)
        working-directory: lumaris_api
        run: python stripe_e2e_flow_test.py

      - name: payout readiness — provider-agnostic seller eligibility (verified rail, not Connect)
        working-directory: lumaris_api
        run: python payout_readiness_test.py

      - name: seller eligibility — live authoritative paid-job gate (payout+rep+fraud+mode)
        working-directory: lumaris_api
        run: python seller_eligibility_test.py

      - name: matmul result validation (offline)
        working-directory: lumaris_api
        run: python matmul_validation_test.py

      - name: account (reset + cal webhook + demo notify)
        working-directory: lumaris_api
        run: python account_test.py

      - name: postgres-only — exact NUMERIC, advisory lock, true races
        working-directory: lumaris_api
        # These assertions are meaningless on SQLite and are the reason this job exists:
        #   * NUMERIC(20,8) really is exact in the database (not float round-tripped)
        #   * pg_try_advisory_lock elects exactly ONE maintenance leader
        #     (without it, every gunicorn worker runs its own reaper)
        #   * 50 threads racing one wallet -> exactly the right number win
        run: python postgres_test.py

      - name: ledger audit — integrity + booking/payout reconciliation (real Postgres ledger)
        working-directory: lumaris_api
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/petabyte_test
        # Audits the ledger the suite just built on Postgres: every tx balances, the ledger
        # sums to zero, and captures/transfers reconcile with bookings/payouts. Fails CI on
        # any financial drift.
        run: python ../scripts/audit_ledger.py

      - name: ledger audit — sign-aware reconciliation (wrong-direction leg)
        working-directory: lumaris_api
        # Proves the audit rejects a mis-directed capture leg that still balances — a plain
        # magnitude sum would have passed it. Offline (forces its own throwaway SQLite DB).
        env:
          DATABASE_URL: ""
        run: python ../scripts/audit_ledger_test.py

  config:
    # GitHub-config source of truth: manifest freshness, the validator (defaults,
    # formats, test/live separation, fail-closed secrets), the deploy-env generator's
    # scope isolation (a GPU node NEVER receives platform secrets), drift, and docs
    # freshness. All offline — no DB, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: repo-root import (canonical `uvicorn lumaris_api.main:app` works)
        run: python scripts/repo_root_import_test.py
      - name: agent dependency/import audit (all hard runtime imports are declared)
        run: python lumaris_agent/deps_audit_test.py
      - name: e2e runner safety (refuses live Stripe; masks + redacts secrets)
        run: python scripts/e2e_marketplace_runner_test.py
      - name: config toolchain tests
        working-directory: lumaris_api
        run: python config_test.py
      - name: ENV_VARS bundle tests (parser / secret-guard / precedence / generated env)
        working-directory: lumaris_api
        run: python env_vars_test.py
      - name: observability (correlation / redaction / cardinality / degrade-safe)
        working-directory: lumaris_api
        run: python observability_test.py
      - name: agent telemetry (span exception-safety / redaction / trace-join / degrade)
        working-directory: lumaris_agent
        run: python agent_telemetry_test.py
      - name: observability smoke (local tier + OTel propagation; remote skipped offline)
        run: python scripts/observability_smoke_test.py
      - name: dashboards + alerts + collector configs are valid JSON/YAML
        run: |
          python - <<'PY'
          import json, glob, yaml, sys
          bad = 0
          for f in glob.glob("observability/grafana/dashboards/*.json"):
              try: json.load(open(f))
              except Exception as e: print(f"::error::{f}: {e}"); bad += 1
          for f in glob.glob("observability/**/*.y*ml", recursive=True):
              try: list(yaml.safe_load_all(open(f)))
              except Exception as e: print(f"::error::{f}: {e}"); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: configuration drift (manifest / code / workflows / template.env in sync)
        run: python scripts/check_configuration_drift.py
      - name: manifest is up to date (re-generate → no diff)
        run: |
          python scripts/build_config_manifest.py
          git diff --exit-code config/github_configuration_manifest.yaml \
            || { echo "::error::manifest is stale — run scripts/build_config_manifest.py and commit"; exit 1; }
      - name: docs are up to date (re-generate → no diff)
        run: |
          python scripts/generate_config_docs.py
          git diff --exit-code docs/GITHUB_CONFIGURATION_REFERENCE.md docs/GITHUB_MANUAL_SETUP_CHECKLIST.md \
            || { echo "::error::config docs are stale — run scripts/generate_config_docs.py and commit"; exit 1; }

  frontend:
    # A broken <script> still returns HTTP 200. Python tests cannot see it.
    # Parse the JS of every rendered page with a real JS engine, and check that
    # every endpoint the UI calls actually exists on the backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: frontend/backend contract
        working-directory: lumaris_api
        run: python audit_frontend.py
        env:
          SECRET_KEY: t
          PAYMENT_WEBHOOK_SECRET: w
          WG_PUBLIC_KEY: x
          WG_ENDPOINT: y
          GOOGLE_OAUTH_STUB: "true"
      - name: rendered JavaScript parses
        working-directory: lumaris_api
        run: python audit_js.py
        env:
          SECRET_KEY: t
          PAYMENT_WEBHOOK_SECRET: w
          WG_PUBLIC_KEY: x
          WG_ENDPOINT: y
          GOOGLE_OAUTH_STUB: "true"

  demo:
    # The investor demo must stay correct and honest: seeding, is_demo labelling,
    # ledger conservation, demo/real metric separation, and reset determinism.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: investor demo (seed + honesty + reset)
        working-directory: lumaris_api
        run: python demo_test.py

  migration:
    # The app builds its schema from create_all() + _ensure_columns(); this proves a
    # usable schema comes up from a COMPLETELY EMPTY database on both engines.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petabyte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: schema builds from a clean SQLite DB
        working-directory: lumaris_api
        env: { SECRET_KEY: t, SERVER_PRIVATE_KEY: t, DATABASE_URL: "sqlite:///./_ci.db" }
        run: python -c "import db; db.init_db(); print('sqlite schema OK')"
      - name: schema builds from a clean PostgreSQL DB
        working-directory: lumaris_api
        env:
          SECRET_KEY: t
          SERVER_PRIVATE_KEY: t
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/petabyte_test
        run: python -c "import db; db.init_db(); print('postgres schema OK')"

  stripe-integration:
    # Real Stripe TEST-mode integration. Proves the configured keys authenticate and
    # create GENUINE test objects (acct_/pi_). The script self-skips (exit 0) when the
    # secrets are absent (fork PRs, or before secrets are set), so it never blocks
    # unrelated changes; it REFUSES any non-sk_test_ key. It never touches live mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: stripe integration (real test mode; skips without secrets)
        working-directory: lumaris_api
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        # Guard FIRST, in the same step that holds the keys: abort before any Stripe call if
        # a LIVE key or live-money switch slipped into the environment. (The test itself also
        # refuses any non-sk_test_ key; this is defence in depth for #46/#47.)
        run: |
          python ../scripts/ci_guard_no_live.py
          python stripe_integration_test.py

  email-integration:
    # Sends a REAL transactional email via the Mailgun HTTP API to prove end-to-end
    # delivery (DKIM/SPF, HTML + text). MANUAL-ONLY: it runs solely on workflow_dispatch, so it
    # NEVER fires on a push to main or on a pull request — no email is sent per commit. Trigger
    # it deliberately from the Actions tab ("tests" -> Run workflow) when you want to verify
    # delivery. The script also self-skips (exit 0) when MAILGUN_API_KEY is absent.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: mailgun real send (skips without secret)
        working-directory: lumaris_api
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: petabyte.market
        run: python email_integration_test.py

  local-e2e:
    # Runs the whole platform locally (uvicorn + SQLite + fake Stripe gateway) and
    # drives a full buyer→seller→settlement flow through it end-to-end: seller
    # onboarding + Ed25519-signed results, the payment FSM, job dispatch/claim, and
    # capture + seller transfer. No GPU and no real Stripe — proves the wiring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: local buyer→seller→settlement E2E (offline full flow)
        run: python scripts/e2e/local_e2e.py

  payout-coverage:
    # Honest seller-payout country coverage. The script EXITS NON-ZERO until we reach
    # 100 genuinely verified + implemented + approved + active countries. Today that is
    # 0/100 by design: coverage grows only through real provider approvals and shipped
    # rail adapters, never by editing the dataset. This runs as a visible tracking
    # signal (continue-on-error) rather than a hard gate, so it can't be "passed" by
    # faking data — the red status is the truth until real reach exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt
      - name: seller-payout country coverage (target 100 — honest shortfall expected)
        run: |
          set +e
          out=$(python scripts/verify_payout_country_coverage.py --target 100 2>&1)
          code=$?
          echo "$out"
          {
            echo "## Seller-payout country coverage"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
            if [ "$code" -eq 0 ]; then
              echo "**Result:** target met (exit 0)."
            elif [ "$code" -eq 1 ]; then
              echo "**Result:** EXPECTED coverage shortfall (exit 1)."
              echo "Coverage grows only via real provider approvals + implemented rails."
              echo "This job is intentionally kept **green** while the number is honestly"
              echo "below target — the shortfall is the truth, not a build failure."
            else
              echo "**Result:** ❌ VERIFIER ERROR (exit $code) — failing the job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # exit 1 (expected shortfall) stays green ON PURPOSE; any other non-zero fails.
          if [ "$code" -eq 0 ] || [ "$code" -eq 1 ]; then exit 0; fi
          exit 1

  lint:
    # Non-blocking style signal today (|| true) so a formatting nit never blocks a
    # security fix; tighten to blocking once the tree is clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - name: ruff (lint)
        run: ruff check lumaris_api lumaris_agent lumaris_gateway || true
      - name: ruff (format check)
        run: ruff format --check lumaris_api || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r lumaris_api/requirements.txt || true
      - name: secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
