name: Verify Sentry (TEST)

# Deliberately send ONE test event to the TEST Sentry project and confirm the whole path works:
#   ENV_VARS bundle (SENTRY_DSN=...) -> resolved+masked -> job env -> init_observability
#   -> sentry_sdk.init -> capture_message -> flush.
#
# Manual only (workflow_dispatch). Binds environment: TEST. The DSN is a non-secret key inside
# the ENV_VARS Repository Variable; it is resolved, masked (::add-mask::), and never echoed,
# summarised, or written to an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sentry-test:
    # Binds to the GitHub Environment named TEST. SENTRY_DSN is a non-secret key inside the
    # ENV_VARS Repository Variable bundle (resolved in the step below), not an individual var/secret.
    environment: TEST
    runs-on: ubuntu-latest
    env:
      SENTRY_ENVIRONMENT: test
      SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # SENTRY_DSN is a NON-secret key inside the ENV_VARS bundle. Resolve it, register it as a
      # masked value (so it can never appear in a later log line), and export it to the env for
      # the following steps. The value is never echoed.
      - name: Resolve + mask SENTRY_DSN from ENV_VARS
        env:
          ENV_VARS: ${{ vars.ENV_VARS }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import env_vars as ev
          vals, _ = ev.parse_bundle(os.environ.get("ENV_VARS", "") or "")
          dsn = vals.get("SENTRY_DSN", "")
          if dsn:
              print(f"::add-mask::{dsn}")          # GitHub masks the value even in this command
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"SENTRY_DSN={dsn}\n")
          else:
              sys.stderr.write("::warning::SENTRY_DSN not found in ENV_VARS — the send step will fail.\n")
          PY

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lumaris_api/requirements.txt

      # 1) Offline unit gate — proves init is degrade-safe and redaction works. No network.
      - name: Sentry unit tests (mocked; no network)
        run: cd lumaris_api && python sentry_test.py

      # 2) Real one-shot verification against the TEST Sentry project.
      - name: Send ONE test event to Sentry (TEST)
        run: python scripts/sentry_selftest.py --send

      - name: Result (no secrets)
        if: always()
        run: |
          {
            echo "## Sentry TEST verification"
            echo ""
            echo "Sent one test event to the TEST Sentry project (environment=\`test\`,"
            echo "release=\`${GITHUB_SHA}\`). Open Sentry -> project -> environment \`test\` to confirm."
            echo "The DSN is never printed."
          } >> "$GITHUB_STEP_SUMMARY"
