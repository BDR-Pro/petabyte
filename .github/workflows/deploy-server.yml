name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "lumaris_api/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo /opt/lumaris/deploy/update.sh

      # Fetch the env report over a plain SSH command and drop it in the job summary.
      # This never fails the run: if the report can't be read, we say so and move on.
      - name: Env report to job summary
        if: always()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          REPORT="$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            'sudo bash /opt/lumaris/deploy/env-report.sh 2>/dev/null' || true)"
          rm -f ~/.ssh/deploy_key
          {
            echo "## Deploy environment report"
            echo '```'
            if [ -n "$REPORT" ]; then echo "$REPORT"; else echo "(report unavailable — deploy log has details)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
