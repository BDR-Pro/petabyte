name: Deploy server

# GitHub is the source of truth for deployment configuration.
#
# - NON-SECRET config lives in ONE GitHub Variable:
#     ENV_VARS
#   using KEY=value; pairs.
#
# - Secrets remain individual GitHub Secrets.
#
# - DEPLOY_CONFIG_FROM_GITHUB is the rollout gate.
#
# - The workflow:
#     1. validates ENV_VARS + Secrets
#     2. resolves deploy host/user
#     3. configures pinned SSH host identity
#     4. generates /etc/lumaris/lumaris.env
#     5. starts deployment as a transient systemd job
#     6. polls deploy state using short SSH connections
#     7. polls /healthz using short SSH connections
#     8. rolls back env on failure
#     9. writes a sanitized env report
#
# Standalone Variables:
#   ENV_VARS
#   DEPLOY_CONFIG_FROM_GITHUB

on:
  push:
    branches:
      - main
    paths:
      - "lumaris_api/**"
      - "lumaris_gateway/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/deploy-server.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  # Test gate: the FULL suite (sqlite + the Postgres "one that counts" + config + docker
  # build + secret scan) must pass before anything touches production. Previously `deploy`
  # only depended on config/secret validation, so a push to main that broke the money code
  # but kept valid config would still ship. Reusing tests.yml (workflow_call) keeps a single
  # source of truth for what "green" means — the deploy bar is exactly the CI bar.
  tests:
    name: test gate
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  configuration-preflight:
    runs-on: ubuntu-latest
    environment: TEST

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate ENV_VARS + Secrets
        id: validate
        continue-on-error: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB != 'true' }}
        env:
          ENV_VARS: ${{ vars.ENV_VARS || secrets.ENV_VARS }}
          DEPLOY_CONFIG_FROM_GITHUB: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB }}
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail

          python scripts/validate_github_configuration.py \
            --env-name auto \
            | tee /tmp/config-summary.txt

      - name: Configuration summary
        if: always()
        env:
          ROLLOUT_GATE: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB || 'false' }}
        run: |
          {
            echo "## Configuration preflight"
            echo ""
            echo "Rollout gate DEPLOY_CONFIG_FROM_GITHUB=$ROLLOUT_GATE"
            echo ""
            echo '```text'
            cat /tmp/config-summary.txt 2>/dev/null \
              || echo "(no summary produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs:
      - tests
      - configuration-preflight

    runs-on: ubuntu-latest
    environment: TEST

    env:
      SSH_COMMON: >-
        -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/home/runner/.ssh/known_hosts
        -o ConnectTimeout=15
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=4
        -o TCPKeepAlive=yes
        -o BatchMode=yes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Resolve deploy host + user from ENV_VARS
        env:
          ENV_VARS: ${{ vars.ENV_VARS || secrets.ENV_VARS }}
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import sys

          sys.path.insert(0, "scripts")
          import env_vars as ev

          vals, errors = ev.parse_bundle(
              os.environ.get("ENV_VARS", "") or ""
          )

          if errors:
              for error in errors:
                  sys.stderr.write(f"::error::{error}\n")
              sys.exit(1)

          host = vals.get("DROPLET_HOST", "").strip()
          user = vals.get("DROPLET_USER", "").strip()

          if not host:
              sys.stderr.write(
                  "::error::DROPLET_HOST must be present in ENV_VARS\n"
              )
              sys.exit(1)

          if not user:
              sys.stderr.write(
                  "::error::DROPLET_USER must be present in ENV_VARS\n"
              )
              sys.exit(1)

          print(f"DROPLET_HOST={host}")
          print(f"DROPLET_USER={user}")
          PY

      - name: Set up SSH key + pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${DEPLOY_SSH_KEY//[[:space:]]/}" ]; then
            echo "::error::DEPLOY_SSH_KEY is empty." >&2
            exit 1
          fi

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -z "${DROPLET_SSH_KNOWN_HOSTS//[[:space:]]/}" ]; then
            echo "::error::DROPLET_SSH_KNOWN_HOSTS is empty." >&2
            echo "::error::Refusing deployment without a pinned host key." >&2
            exit 1
          fi

          printf '%s\n' "$DROPLET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen \
            -F "$DROPLET_HOST" \
            -f ~/.ssh/known_hosts \
            >/dev/null; then

            echo "::error::known_hosts does not contain $DROPLET_HOST" >&2
            exit 1
          fi

          echo "Pinned SSH host key found for $DROPLET_HOST"

      - name: SSH authentication preflight
        run: |
          set -euo pipefail

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" \
            'printf "ssh preflight OK\n"'

      - name: Generate + push server env
        if: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB == 'true' }}
        env:
          ENV_VARS: ${{ vars.ENV_VARS || secrets.ENV_VARS }}
          DEPLOY_CONFIG_FROM_GITHUB: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB }}
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          umask 077

          python scripts/validate_github_configuration.py \
            --env-name auto \
            >/dev/null

          python scripts/generate_deploy_env.py \
            --target platform \
            --out .env.platform.generated

          test -s .env.platform.generated

          scp \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            .env.platform.generated \
            "$DROPLET_USER@$DROPLET_HOST:/tmp/lumaris.env.incoming"

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" '
              set -euo pipefail

              sudo install \
                -d \
                -m 755 \
                -o root \
                -g root \
                /etc/lumaris

              if sudo test -f /etc/lumaris/lumaris.env; then
                sudo cp -a \
                  /etc/lumaris/lumaris.env \
                  /etc/lumaris/lumaris.env.deploybak
              fi

              sudo install \
                -m 600 \
                -o lumaris \
                -g lumaris \
                /tmp/lumaris.env.incoming \
                /etc/lumaris/lumaris.env

              sudo rm -f /tmp/lumaris.env.incoming

              sudo test -s /etc/lumaris/lumaris.env
            '

      - name: Verify required runtime config exists
        if: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB == 'true' }}
        run: |
          set -euo pipefail

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" '
              set -euo pipefail

              require_key() {
                key="$1"

                if ! sudo grep -q "^${key}=." /etc/lumaris/lumaris.env; then
                  echo "::error::$key is missing or empty in /etc/lumaris/lumaris.env"
                  exit 1
                fi
              }

              require_key STRIPE_GATEWAY
              require_key STRIPE_MODE
              require_key SECRET_KEY
              require_key SERVER_PRIVATE_KEY
              require_key DATABASE_URL

              echo "required runtime config present"
            '

      - name: Remove stale transient deploy unit
        run: |
          set -euo pipefail

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" '
              set +e

              sudo systemctl stop \
                lumaris-github-deploy.service \
                2>/dev/null

              sudo systemctl reset-failed \
                lumaris-github-deploy.service \
                2>/dev/null

              exit 0
            '

      - name: Start deploy as transient systemd job
        run: |
          set -euo pipefail

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" '
              set -euo pipefail

              sudo systemd-run \
                --unit=lumaris-github-deploy \
                --property=Type=oneshot \
                /bin/bash \
                /opt/lumaris/deploy/update.sh
            '

      - name: Wait for remote deploy
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=150
          WAIT_SECONDS=5

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            OUTPUT="$(
              ssh \
                $SSH_COMMON \
                -i ~/.ssh/deploy_key \
                "$DROPLET_USER@$DROPLET_HOST" '
                  sudo systemctl show \
                    lumaris-github-deploy.service \
                    --property=ActiveState \
                    --property=SubState \
                    --property=Result \
                    --property=ExecMainStatus \
                    --no-pager \
                    2>/dev/null || true
                ' 2>/dev/null || true
            )"

            ACTIVE_STATE="$(
              printf '%s\n' "$OUTPUT" \
                | sed -n 's/^ActiveState=//p'
            )"

            SUB_STATE="$(
              printf '%s\n' "$OUTPUT" \
                | sed -n 's/^SubState=//p'
            )"

            RESULT="$(
              printf '%s\n' "$OUTPUT" \
                | sed -n 's/^Result=//p'
            )"

            EXIT_CODE="$(
              printf '%s\n' "$OUTPUT" \
                | sed -n 's/^ExecMainStatus=//p'
            )"

            echo \
              "deploy attempt=$attempt/$MAX_ATTEMPTS active=${ACTIVE_STATE:-unknown} sub=${SUB_STATE:-unknown} result=${RESULT:-unknown}"

            if [ "$ACTIVE_STATE" = "failed" ]; then
              echo "::error::Remote deploy entered failed state."

              ssh \
                $SSH_COMMON \
                -i ~/.ssh/deploy_key \
                "$DROPLET_USER@$DROPLET_HOST" \
                'sudo journalctl \
                  -u lumaris-github-deploy.service \
                  -n 250 \
                  --no-pager' \
                || true

              exit 1
            fi

            if [ "$ACTIVE_STATE" = "inactive" ]; then

              if [ "$RESULT" = "success" ] \
                && [ "${EXIT_CODE:-0}" = "0" ]; then

                echo "Remote deployment completed successfully."
                exit 0
              fi

              echo "::error::Remote deployment completed unsuccessfully."
              echo "Result=${RESULT:-unknown}"
              echo "ExecMainStatus=${EXIT_CODE:-unknown}"

              ssh \
                $SSH_COMMON \
                -i ~/.ssh/deploy_key \
                "$DROPLET_USER@$DROPLET_HOST" \
                'sudo journalctl \
                  -u lumaris-github-deploy.service \
                  -n 250 \
                  --no-pager' \
                || true

              exit 1
            fi

            sleep "$WAIT_SECONDS"
          done

          echo "::error::Remote deployment timed out."

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" \
            'sudo journalctl \
              -u lumaris-github-deploy.service \
              -n 250 \
              --no-pager' \
            || true

          exit 1

      - name: Verify API health
        if: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB == 'true' }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=24
          WAIT_SECONDS=5
          ok=0

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            echo "Health attempt $attempt/$MAX_ATTEMPTS"

            if ssh \
              $SSH_COMMON \
              -i ~/.ssh/deploy_key \
              "$DROPLET_USER@$DROPLET_HOST" \
              'curl \
                -fsS \
                --connect-timeout 3 \
                --max-time 5 \
                http://127.0.0.1:8000/healthz \
                >/dev/null'
            then
              ok=1
              echo "API health OK"
              break
            fi

            sleep "$WAIT_SECONDS"
          done

          if [ "$ok" != 1 ]; then
            echo "::error::API health check failed after deploy."
            exit 1
          fi

      - name: Roll back environment on failure
        if: ${{ failure() && vars.DEPLOY_CONFIG_FROM_GITHUB == 'true' }}
        run: |
          set +e

          echo "Attempting environment rollback..."

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" '
              set +e

              if ! sudo test \
                -f /etc/lumaris/lumaris.env.deploybak; then

                echo "No previous environment backup available."
                exit 0
              fi

              sudo install \
                -m 600 \
                -o lumaris \
                -g lumaris \
                /etc/lumaris/lumaris.env.deploybak \
                /etc/lumaris/lumaris.env

              sudo systemctl restart \
                lumaris-api \
                lumaris-reaper

              echo "Previous environment restored."
            ' \
            || true

          echo "Waiting briefly before rollback health verification..."
          sleep 5

          for attempt in $(seq 1 12); do

            if ssh \
              $SSH_COMMON \
              -i ~/.ssh/deploy_key \
              "$DROPLET_USER@$DROPLET_HOST" \
              'curl \
                -fsS \
                --connect-timeout 3 \
                --max-time 5 \
                http://127.0.0.1:8000/healthz \
                >/dev/null'
            then
              echo "Rollback health OK"
              exit 0
            fi

            echo "Rollback health attempt $attempt/12 failed"
            sleep 5
          done

          echo "::error::Rollback completed but API remains unhealthy."

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" \
            'sudo journalctl \
              -u lumaris-api.service \
              -n 100 \
              --no-pager' \
            || true

          exit 0

      - name: API diagnostics on failure
        if: failure()
        run: |
          set +e

          ssh \
            $SSH_COMMON \
            -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" '
              echo "=== lumaris-api ==="
              sudo systemctl status \
                lumaris-api.service \
                --no-pager \
                -l || true

              echo
              echo "=== lumaris-reaper ==="
              sudo systemctl status \
                lumaris-reaper.service \
                --no-pager \
                -l || true

              echo
              echo "=== lumaris-api journal ==="
              sudo journalctl \
                -u lumaris-api.service \
                -n 120 \
                --no-pager || true

              echo
              echo "=== port 8000 ==="
              ss -lntp \
                | grep ":8000" \
                || true
            ' \
            || true

      - name: Env report to job summary
        if: always()
        run: |
          set +e

          REPORT="$(
            ssh \
              $SSH_COMMON \
              -i ~/.ssh/deploy_key \
              "$DROPLET_USER@$DROPLET_HOST" \
              'sudo bash \
                /opt/lumaris/deploy/env-report.sh \
                2>/dev/null' \
              2>/dev/null
          )"

          {
            echo "## Deploy environment report"
            echo ""
            echo '```text'

            if [ -n "$REPORT" ]; then
              echo "$REPORT"
            else
              echo "(report unavailable — deploy log has details)"
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Cleanup generated secrets from runner
        if: always()
        run: |
          set +e
          rm -f .env.platform.generated
          rm -f .env.gpu.generated
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts
