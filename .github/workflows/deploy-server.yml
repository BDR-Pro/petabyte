name: Deploy server

# GitHub Variables + Secrets are the source of truth for deployment configuration.
#
#   1. configuration-preflight resolves ${{ vars.* }} / ${{ secrets.* }}, applies the
#      documented defaults, validates formats + Stripe test/live separation, and verifies
#      every REQUIRED secret is present. Secret VALUES are never printed.
#   2. deploy (when enabled) generates the server env from that config, ships it to the
#      box, and restarts — so nothing long-lived is hand-maintained on the server.
#
# ROLLOUT GATE — set the repository Variable DEPLOY_CONFIG_FROM_GITHUB=true ONCE you have
# entered every Secret in GitHub (see docs/GITHUB_MANUAL_SETUP_CHECKLIST.md), including a
# one-time migration of SECRET_KEY / SERVER_PRIVATE_KEY / DATABASE_URL from the server's
# current /etc/lumaris/lumaris.env. Until it is true, the preflight runs as an advisory
# report and the deploy stays code-only (it never overwrites the server env), so nothing
# breaks while you fill in the config.

on:
  push:
    branches: [main]
    paths:
      - "lumaris_api/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  configuration-preflight:
    # Runs before the deploy. Blocking only when the rollout gate is on; otherwise advisory
    # so the code-only deploy keeps working while GitHub config is still being filled in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: validate resolved GitHub configuration
        id: validate
        continue-on-error: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB != 'true' }}
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python scripts/validate_github_configuration.py \
            --env-name "${{ vars.ENVIRONMENT || vars.APP_ENV || 'development' }}" \
            | tee /tmp/config-summary.txt
      - name: configuration summary (sanitised — secrets shown as SET only)
        if: always()
        run: |
          {
            echo "## Configuration preflight"
            echo ""
            echo "Rollout gate DEPLOY_CONFIG_FROM_GITHUB=${{ vars.DEPLOY_CONFIG_FROM_GITHUB || 'false' }}"
            echo ""
            echo '```'
            cat /tmp/config-summary.txt 2>/dev/null || echo "(no summary produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: configuration-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml

      # Generate the server env from GitHub config, then ship it — ONLY when the gate is on.
      # The generated file is 0600, git-ignored, never printed, and deleted from the runner.
      - name: generate + push server env from GitHub config
        if: ${{ vars.DEPLOY_CONFIG_FROM_GITHUB == 'true' }}
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail
          umask 077
          # revalidate (blocking) before we ship anything
          python scripts/validate_github_configuration.py \
            --env-name "${{ vars.ENVIRONMENT || vars.APP_ENV || 'development' }}" >/dev/null
          python scripts/generate_deploy_env.py --target platform --out .env.platform.generated
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # push to a temp path, then install atomically as the lumaris-owned 0600 env file
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            .env.platform.generated "$DROPLET_USER@$DROPLET_HOST:/tmp/lumaris.env.incoming"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" \
            'sudo install -m 600 -o lumaris -g lumaris /tmp/lumaris.env.incoming /etc/lumaris/lumaris.env && sudo rm -f /tmp/lumaris.env.incoming'

      - name: Deploy code + restart over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" 'sudo /opt/lumaris/deploy/update.sh'

      - name: cleanup generated secrets from the runner
        if: always()
        run: rm -f .env.platform.generated ~/.ssh/deploy_key

      # Fetch the env report over a plain SSH command and drop it in the job summary.
      # This never fails the run: if the report can't be read, we say so and move on.
      - name: Env report to job summary
        if: always()
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          REPORT="$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" \
            'sudo bash /opt/lumaris/deploy/env-report.sh 2>/dev/null' || true)"
          rm -f ~/.ssh/deploy_key
          {
            echo "## Deploy environment report"
            echo '```'
            if [ -n "$REPORT" ]; then echo "$REPORT"; else echo "(report unavailable — deploy log has details)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
