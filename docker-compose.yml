# Petabyte — one-command local stack: API + PostgreSQL.
#
#   docker compose up --build        # -> http://localhost:8000  (API docs at /docs, trust at /trust)
#
# The secrets below are INSECURE DEV DEFAULTS so the stack boots with zero setup for a demo.
# For anything real, override them (a .env next to this file, or `-e`), and generate fresh keys:
#   SECRET_KEY:          openssl rand -hex 32
#   SERVER_PRIVATE_KEY:  python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
# PAYMENTS stay in sandbox mode here; live money requires PAYMENTS_LIVE_ENABLED + real Stripe keys.
name: petabyte

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: petabyte
      POSTGRES_PASSWORD: petabyte
      POSTGRES_DB: petabyte
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petabyte -d petabyte"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://petabyte:petabyte@db:5432/petabyte
      # --- INSECURE DEV DEFAULTS — override for anything beyond a local demo ---
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-jwt-signing-key-change-me}
      SERVER_PRIVATE_KEY: ${SERVER_PRIVATE_KEY:-HjosLuZJfl-Qo_pSU5b61P_E5202al_7t9va97hjYBE=}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-insecure-webhook-secret}
      WG_PUBLIC_KEY: ${WG_PUBLIC_KEY:-dev-wireguard-public-key}
      WG_ENDPOINT: ${WG_ENDPOINT:-127.0.0.1:51820}
      GOOGLE_OAUTH_STUB: "true"
      ENVIRONMENT: development
      PAYMENTS_MODE: sandbox
      BIND: 0.0.0.0:8000
      WEB_CONCURRENCY: "2"
    ports:
      - "8000:8000"

volumes:
  pgdata: {}
