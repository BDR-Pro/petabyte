# Prometheus config for the local/self-hosted docker-compose stack.
# -----------------------------------------------------------------------------
# This is the COMPOSE-LOCAL config (plain HTTP, internal docker DNS, no secrets,
# no remote_write). The PRODUCTION scaffold is ../prometheus/prometheus.yml
# (TLS + WireGuard + file_sd + remote_write). It loads the SAME rules file so
# recording/alerting rules are identical in both.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: petabyte
    # Static for the compose-local stack (Prometheus does not shell-expand its config).
    # App metrics carry their own `environment` label; this only labels infra/self metrics.
    # Production renders ../prometheus/prometheus.yml via envsubst at deploy time.
    environment: staging

rule_files:
  - /etc/prometheus/rules/petabyte_rules.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:9464"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # --- Petabyte API -----------------------------------------------------------
  # The app runs OUTSIDE this stack. Point PETABYTE_API_TARGET at it (host:port
  # reachable from the obs network) and mount its bearer token to scrape
  # /internal/metrics. Left commented so the stack starts clean without the app.
  # - job_name: petabyte-api
  #   metrics_path: /internal/metrics
  #   bearer_token_file: /etc/prometheus/secrets/petabyte_metrics_token
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]
  #       labels: { service: petabyte-api }
