# Grafana dashboard provider — loads Petabyte dashboards from disk.
# Dashboards are version-controlled JSON in this repo and mounted into the
# Grafana container at /var/lib/grafana/dashboards (read-only recommended).
apiVersion: 1

providers:
  - name: petabyte
    orgId: 1
    folder: Petabyte
    folderUid: petabyte
    type: file
    disableDeletion: true
    # Allow the file provider to keep dashboards in sync with git on redeploy.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
