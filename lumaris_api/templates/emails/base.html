<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{subject}}</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <style>
    body,table,td,a{ -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table,td{ mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img{ -ms-interpolation-mode:bicubic; }
    a{ color:#0b0b0c; }
    @media only screen and (max-width:600px){
      .container{ width:100%!important; border-radius:0!important; }
      .px{ padding-left:22px!important; padding-right:22px!important; }
      .h1{ font-size:24px!important; line-height:30px!important; }
      .btn a{ display:block!important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f2f3f5;-webkit-font-smoothing:antialiased;">
  <div style="display:none;font-size:1px;color:#f2f3f5;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f2f3f5;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(10,11,12,0.08);">
          <!-- Header: dark brand band with the Petabyte mark + wordmark -->
          <tr>
            <td class="px" style="background:#0b0b0c;padding:22px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:12px;vertical-align:middle;">
                    <img src="cid:petabyte-logo.png" width="34" height="34" alt="petabyte cloud" style="display:block;border:0;outline:none;text-decoration:none;width:34px;height:34px;">
                  </td>
                  <td style="vertical-align:middle;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.3px;color:#ffffff;">
                    petabyte <span style="color:#9aa0a6;font-weight:600;">cloud</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td class="px" style="padding:38px 40px 8px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
              {{content}}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td class="px" style="padding:26px 40px 34px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
              <hr style="border:none;border-top:1px solid #eceef0;margin:0 0 20px;">
              <p style="margin:0 0 6px;font-size:12px;line-height:18px;color:#9aa0a6;">Petabyte Cloud — the global GPU compute marketplace.</p>
              <p style="margin:0 0 6px;font-size:12px;line-height:18px;color:#9aa0a6;">Questions? Email <a href="mailto:support@petabyte.market" style="color:#6b7280;text-decoration:underline;">support@petabyte.market</a>.</p>
              <p style="margin:0;font-size:12px;line-height:18px;color:#c2c7cc;">&copy; {{year}} Petabyte Cloud. All rights reserved.</p>
            </td>
          </tr>
        </table>
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">
          <tr>
            <td align="center" style="padding:16px 40px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;line-height:16px;color:#b7bcc2;">
              {{footer_note}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
