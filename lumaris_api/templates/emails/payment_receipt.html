<h1 class="h1" style="margin:0 0 6px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.5px;color:#0b0b0c;">Payment receipt</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:23px;color:#8a9099;">Receipt {{reference}} · {{date}}</p>
<div style="margin:0 0 22px;padding:22px 22px 6px;background:#f6f7f9;border:1px solid #eceef0;border-radius:14px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td colspan="2" style="padding:0 0 4px;font-size:13px;line-height:18px;color:#8a9099;">Amount charged</td>
    </tr>
    <tr>
      <td colspan="2" style="padding:0 0 16px;font-size:34px;line-height:40px;font-weight:700;letter-spacing:-0.5px;color:#0b0b0c;">{{amount}}</td>
    </tr>
    <tr><td colspan="2" style="border-top:1px solid #e6e8eb;padding:14px 0 0;"></td></tr>
    <tr>
      <td align="left" style="padding:8px 0;font-size:14px;line-height:20px;color:#6b7280;">Description</td>
      <td align="right" style="padding:8px 0;font-size:14px;line-height:20px;color:#0b0b0c;font-weight:600;">{{description}}</td>
    </tr>
    <tr>
      <td align="left" style="padding:8px 0;font-size:14px;line-height:20px;color:#6b7280;">Date</td>
      <td align="right" style="padding:8px 0;font-size:14px;line-height:20px;color:#0b0b0c;font-weight:600;">{{date}}</td>
    </tr>
    <tr>
      <td align="left" style="padding:8px 0 16px;font-size:14px;line-height:20px;color:#6b7280;">Reference</td>
      <td align="right" style="padding:8px 0 16px;font-size:14px;line-height:20px;color:#0b0b0c;font-weight:600;">{{reference}}</td>
    </tr>
  </table>
</div>
<table role="presentation" class="btn" cellpadding="0" cellspacing="0" border="0" style="margin:6px 0 10px;">
  <tr>
    <td align="center" bgcolor="#0b0b0c" style="border-radius:10px;">
      <a href="{{cta_url}}" target="_blank" style="display:inline-block;padding:14px 30px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">View transaction</a>
    </td>
  </tr>
</table>
<p style="margin:18px 0 0;font-size:14px;line-height:22px;color:#8a9099;">Thanks for using Petabyte Cloud. Keep this receipt for your records.</p>
