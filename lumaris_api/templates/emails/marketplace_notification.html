<h1 class="h1" style="margin:0 0 16px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.5px;color:#0b0b0c;">{{title}}</h1>
<p style="margin:0 0 16px;font-size:16px;line-height:25px;color:#3a3d42;">{{message}}</p>
<table role="presentation" class="btn" cellpadding="0" cellspacing="0" border="0" style="margin:26px 0 10px;">
  <tr>
    <td align="center" bgcolor="#0b0b0c" style="border-radius:10px;">
      <a href="{{cta_url}}" target="_blank" style="display:inline-block;padding:14px 30px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">{{cta_label}}</a>
    </td>
  </tr>
</table>
<p style="margin:18px 0 0;font-size:14px;line-height:22px;color:#8a9099;">You're receiving this because it relates to activity on your Petabyte Cloud account.</p>
