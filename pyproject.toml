# The `petabyte` CLI — the client for the Petabyte GPU marketplace.
#
# Deliberately separate from the server package (lumaris_api/pyproject.toml, name="api", which
# pulls in FastAPI/uvicorn/psycopg2/...). Installing the CLI must NOT drag the server in: it only
# talks to the API over HTTPS. Its one runtime dependency is httpx (for the compute commands); the
# bundled model hub is pure standard library, so it adds nothing. That keeps `pip install petabyte-client`
# small enough to hand to a non-technical user.
#
# Ships BOTH command families in one install:
#   * compute — register / login / deposit / specs / run / launch / wallet / vpn / earnings / node
#   * model hub — model / pull / run <model-id>  (Ollama/HF-style pull with a verified local cache)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is `petabyte-client` (the plain `petabyte` name is taken on PyPI). The installed
# COMMAND and the import module stay `petabyte` — users run `petabyte ...` after `pip install petabyte-client`.
name = "petabyte-client"
version = "0.1.0"
description = "Petabyte CLI — rent verified GPU compute, launch apps, and pull AI models from your terminal."
readme = "lumaris_api/cli/README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Petabyte, Inc." }]
keywords = ["gpu", "compute", "cloud", "marketplace", "cli", "ai", "models"]
classifiers = [
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://petabyte.market"
Documentation = "https://petabyte.market/wiki"
Source = "https://github.com/BDR-Pro/petabyte"

[project.scripts]
petabyte = "petabyte:main"

# The CLI module (petabyte.py, from lumaris_api/cli/) + the pure-stdlib model hub package
# (modelhub, from lumaris_api/modelhub/) — and nothing else in the repo. Bundling modelhub is what
# makes `petabyte pull` / `petabyte model` work straight from `pip install petabyte-client`.
[tool.setuptools]
py-modules = ["petabyte"]
packages = ["modelhub", "modelhub.providers"]

[tool.setuptools.package-dir]
"" = "lumaris_api/cli"
"modelhub" = "lumaris_api/modelhub"
