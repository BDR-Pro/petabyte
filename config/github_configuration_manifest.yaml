    required: true
    default: null
    scope:
    - deployment
    description: "Pinned SSH host key(s) for the deploy target. Generate with `ssh-keyscan -t ed25519,rsa\
      \ <host>`, then VERIFY the fingerprint out-of-band before pinning \u2014 compare `ssh-keygen -lf`\
      \ of the scanned key against the fingerprint from the droplet's own console (e.g. `ssh-keygen -lf\
      \ /etc/ssh/ssh_host_ed25519_key.pub` over the provider console). ssh-keyscan output is unauthenticated\
      \ and can be MITM'd, so pinning it unverified only trusts-on-first-use. Verifies the server before\
      \ any secret is transferred; the deploy fails closed if unset."
